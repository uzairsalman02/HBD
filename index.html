<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday My Life Partner ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background-color: #faf6f0;
      font-family: 'Amatic SC', cursive;
      color: #3d352e;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Watercolor Paper Grain Overlay */
    body::after {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 60;
      opacity: 0.38;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paper)' opacity='0.16'/%3E%3C/svg%3E");
    }

    /* 1. PORTRAIT ROTATE OVERLAY */
    #rotate-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: #faf6f0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .phone-icon {
      width: 55px; height: 95px;
      border: 3.5px solid #d96b43;
      border-radius: 12px;
      margin-bottom: 25px;
      position: relative;
      animation: rotatePhone 2.2s infinite ease-in-out;
    }
    .phone-icon::after {
      content: ""; position: absolute;
      bottom: 7px; left: 50%; transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%; background: #d96b43;
    }
    @keyframes rotatePhone {
      0%, 15% { transform: rotate(0deg); }
      55%, 80% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
    #rotate-overlay h2 { font-size: 3.2rem; color: #3d352e; letter-spacing: 2px; }
    #rotate-overlay p { font-size: 2rem; color: #d96b43; margin-top: 8px; }

    @media screen and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }

    /* 2. START & END OVERLAYS */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(250, 246, 240, 0.96);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
      text-align: center; padding: 1rem;
    }
    .modal-overlay.hidden {
      opacity: 0; pointer-events: none;
    }
    .modal-overlay h1 {
      font-size: clamp(3.2rem, 7vw, 5.8rem);
      letter-spacing: 5px; color: #3d352e;
    }
    .modal-overlay p {
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
      color: #8c7a6b; margin-top: 6px; letter-spacing: 2px;
    }

    /* Preloader Progress Bar */
    #loader-wrap {
      width: min(300px, 75vw);
      margin-top: 24px;
      display: flex; flex-direction: column; align-items: center;
      transition: opacity 0.4s ease;
    }
    .progress-track {
      width: 100%; height: 8px;
      background: #e6dec8;
      border-radius: 10px; overflow: hidden;
    }
    #progress-fill {
      width: 0%; height: 100%;
      background: #d96b43;
      transition: width 0.3s ease;
    }
    #loader-text {
      font-size: 1.6rem; color: #d96b43;
      margin-top: 10px; letter-spacing: 2px; font-weight: 700;
    }

    /* Play Button (Hidden until loading completes!) */
    #play-btn {
      display: none;
      margin-top: 24px;
      padding: 10px 38px;
      font-family: 'Amatic SC', cursive;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 700;
      color: #fff;
      background: #d96b43;
      border: none; border-radius: 50px;
      box-shadow: 0 8px 24px rgba(217, 107, 67, 0.4);
      cursor: pointer;
      letter-spacing: 2.5px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }
    #play-btn:active { transform: scale(0.95); }

    /* TINY MINIMAL FULLSCREEN ICON BUTTON (Top Right) */
    #fs-btn {
      position: fixed; top: 12px; right: 12px; z-index: 90;
      width: 34px; height: 34px;
      background: rgba(250, 246, 240, 0.55);
      border: 1px solid rgba(217, 107, 67, 0.45);
      color: #d96b43;
      font-size: 1.15rem;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.2s ease;
      backdrop-filter: blur(3px);
    }
    #fs-btn.visible { opacity: 0.7; pointer-events: auto; }
    #fs-btn:hover { opacity: 1; transform: scale(1.08); }

    /* 3. GIFT BOX & BIRTHDAY BLAST SCREEN */
    #gift-stage {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
    }
    .gift-box-svg {
      width: clamp(130px, 22vw, 180px);
      height: clamp(130px, 22vw, 180px);
      filter: drop-shadow(0 12px 24px rgba(217, 107, 67, 0.35));
      animation: giftWobble 1.8s infinite ease-in-out;
      transform-origin: center bottom;
    }
    @keyframes giftWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-8deg) scale(1.05); }
      40% { transform: rotate(8deg) scale(1.05); }
      60% { transform: rotate(-5deg) scale(1.02); }
      80% { transform: rotate(5deg) scale(1.02); }
    }
    .tap-gift-hint {
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: #d96b43; font-weight: 700;
      margin-top: 18px; letter-spacing: 3px;
      animation: pulseText 1.4s infinite ease-in-out;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* Hidden Birthday Message (Reveals after Gift Blast) */
    #bday-message-wrap {
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 160;
    }
    #bday-message-wrap.show {
      display: flex;
      animation: bdayReveal 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes bdayReveal {
      0% { opacity: 0; transform: scale(0.4) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .bday-title {
      font-size: clamp(3.4rem, 8.5vw, 6.8rem);
      font-weight: 700;
      color: #d94b43;
      letter-spacing: 5px;
      line-height: 1.15;
      text-shadow: 0 4px 18px rgba(217, 75, 67, 0.25);
    }
    .bday-sub {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: #5c4b3e;
      margin-top: 8px;
      letter-spacing: 3px;
    }
    /* Small Subtle Replay Button */
    .small-replay-btn {
      margin-top: 28px;
      padding: 6px 22px;
      font-family: 'Amatic SC', cursive;
      font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      font-weight: 700;
      color: #8c7a6b;
      background: rgba(255, 255, 255, 0.75);
      border: 1.5px solid #cbbba8;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }
    .small-replay-btn:hover {
      color: #d96b43; border-color: #d96b43;
      background: #fff; transform: scale(1.05);
    }

    /* 4. FLOATING PARTICLES & BLAST CANVAS */
    #particles-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 170;
    }

    /* 5. VIRTUAL 1920x1080 STAGE */
    #viewport {
      width: 100vw; height: 100vh;
      position: relative; overflow: hidden;
    }
    #stage-scaler {
      position: absolute;
      top: 50%; left: 50%;
      width: 1920px; height: 1080px;
      transform-origin: center center;
      will-change: transform;
    }
    #world {
      position: absolute; top: 0; left: 0;
      width: 7800px; height: 1080px;
      will-change: transform;
    }

    .scene-item {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    /* 6. ORGANIC PAINT-SPLASH FRAMES (No Squares or Rectangles!) */
    .watercolor-art {
      position: relative;
      width: 580px; height: 430px;
      filter: drop-shadow(0 8px 20px rgba(90, 65, 45, 0.08));
    }

    /* Each scene gets a unique organic paint-splash SVG mask */
    .splash-shape-0 { -webkit-mask: url(#splash-0); mask: url(#splash-0); }
    .splash-shape-1 { -webkit-mask: url(#splash-1); mask: url(#splash-1); }
    .splash-shape-2 { -webkit-mask: url(#splash-2); mask: url(#splash-2); }
    .splash-shape-3 { -webkit-mask: url(#splash-3); mask: url(#splash-3); }
    .splash-shape-4 { -webkit-mask: url(#splash-4); mask: url(#splash-4); }
    .splash-shape-5 { -webkit-mask: url(#splash-5); mask: url(#splash-5); }

    .watercolor-art .layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      will-change: clip-path, opacity, transform;
    }

    /* Stage 1: Pencil Sketch Outline */
    .layer-sketch {
      filter: grayscale(100%) contrast(240%) brightness(1.12);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 1s ease, transform 2.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Stage 2: Light Watercolor Wash */
    .layer-wash {
      filter: saturate(0.6) brightness(1.1) contrast(1.05);
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 2.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.9s ease;
    }

    /* Stage 3: Full Rich Watercolor Paint */
    .layer-paint {
      filter: saturate(1.25) contrast(1.06);
      opacity: 0;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 3.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease;
    }

    .watercolor-art.step-sketch .layer-sketch {
      opacity: 0.85;
      transform: scale(1);
    }
    .watercolor-art.step-wash .layer-wash {
      opacity: 0.8;
      clip-path: circle(65% at 50% 50%);
    }
    .watercolor-art.step-paint .layer-paint {
      opacity: 1;
      clip-path: circle(100% at 50% 50%);
    }

    /* Handwritten Lyrics Styling */
    .lyric-block {
      position: absolute;
      font-size: 3.25rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 3px;
      color: #463c33;
      white-space: pre-line;
      text-transform: uppercase;
    }

    .cursor {
      display: inline-block;
      width: 3.5px; height: 2.8rem;
      background-color: #d96b43;
      vertical-align: text-bottom;
      margin-left: 6px;
      animation: blink 0.75s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

  <!-- 6 UNIQUE ORGANIC WATERCOLOR PAINT-SPLASH MASKS (No Squares/Rectangles!) -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <filter id="soft-feather" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="0.025" />
      </filter>

      <!-- Splash Shape 0: Organic Autumn Blob with Splatters -->

          <circle cx="0.10" cy="0.20" r="0.038"/><circle cx="0.88" cy="0.12" r="0.025"/>

      <mask id="splash-3" maskContentUnits="objectBoundingBox">

          <path d="M0.12,0.26 C0.24,0.05 0.76,0.04 0.88,0.24 C0.99,0.42 0.94,0.78 0.78,0.90 C0.58,1.01 0.28,0.95 0.11,0.80 C-0.01,0.65 0.02,0.44 0.12,0.26 Z"/>
          <circle cx="0.06" cy="0.28" r="0.028"/><circle cx="0.92" cy="0.18" r="0.036"/>
          <circle cx="0.86" cy="0.88" r="0.03"/><circle cx="0.08" cy="0.82" r="0.038"/>
        </g>
      </mask>

      <!-- Splash Shape 4: Tilted Petal Watercolor Wash -->
      <mask id="splash-4" maskContentUnits="objectBoundingBox">
        <g filter="url(#soft-feather)" fill="white">
          <path d="M0.22,0.10 C0.48,0.01 0.82,0.09 0.91,0.32 C0.99,0.54 0.89,0.86 0.68,0.94 C0.44,1.01 0.14,0.90 0.06,0.68 C-0.02,0.46 0.05,0.20 0.22,0.10 Z"/>
          <circle cx="0.14" cy="0.12" r="0.032"/><circle cx="0.90" cy="0.20" r="0.026"/>
          <circle cx="0.84" cy="0.90" r="0.038"/><circle cx="0.08" cy="0.80" r="0.028"/>
        </g>
      </mask>

      <!-- Splash Shape 5: Romantic Soft Heart-Infused Splash -->
      <mask id="splash-5" maskContentUnits="objectBoundingBox">
        <g filter="url(#soft-feather)" fill="white">
          <path d="M0.15,0.20 C0.32,0.03 0.68,0.03 0.85,0.20 C0.98,0.35 0.96,0.70 0.80,0.87 C0.64,0.99 0.36,0.99 0.20,0.87 C0.04,0.70 0.02,0.35 0.15,0.20 Z"/>
          <circle cx="0.09" cy="0.16" r="0.034"/><circle cx="0.91" cy="0.16" r="0.034"/>

        </g>
      </mask>
    </defs>
  </svg>

  <!-- Portrait Warning -->
  <div id="rotate-overlay">
    <div class="phone-icon"></div>
    <h2>ROTATE YOUR MOBILE</h2>
    <p>full experience dekhne ke liye phone ko Landscape karein  ♥</p>
    <p>volume increase Karen 🔊</p>
  </div>

  <!-- Start Screen (Play Button appears ONLY when loading finishes!) -->
  <div id="start-overlay" class="modal-overlay">
    <h1>HUMDARD ♥</h1>
    <p>A Special Birthday Gift</p>
    
    <div id="loader-wrap">
      <div class="progress-track">
        <div id="progress-fill"></div>
      </div>
      <div id="loader-text">PREPARING SURPRISE... 0%</div>
    </div>

    <button id="play-btn" onclick="startExperience()">▶ TAP TO PLAY</button>
  </div>

  <!-- End Screen: Interactive Gift Box -> Blast -> Happy Birthday My Life Partner -->
  <div id="end-overlay" class="modal-overlay hidden">
    
    <!-- Step 1: Clickable Wobbling Gift Box -->
    <div id="gift-stage" onclick="openGiftBox()">
      <svg class="gift-box-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Ribbon Loops -->
        <path d="M60 32C60 32 42 10 30 22C18 34 45 42 60 32Z" fill="#e0533c" stroke="#3d352e" stroke-width="3"/>
        <path d="M60 32C60 32 78 10 90 22C102 34 75 42 60 32Z" fill="#e0533c" stroke="#3d352e" stroke-width="3"/>
        <!-- Box Base -->
        <rect x="20" y="48" width="80" height="58" rx="6" fill="#f2a65a" stroke="#3d352e" stroke-width="3"/>
        <!-- Box Lid -->
        <rect x="14" y="32" width="92" height="18" rx="5" fill="#d96b43" stroke="#3d352e" stroke-width="3"/>
        <!-- Vertical & Horizontal Ribbons -->
        <rect x="53" y="32" width="14" height="74" fill="#e0533c" stroke="#3d352e" stroke-width="3"/>
        <rect x="20" y="70" width="80" height="12" fill="#e0533c" stroke="#3d352e" stroke-width="3"/>
      </svg>
      <div class="tap-gift-hint">🎁 TAP TO OPEN YOUR GIFT ♥</div>
    </div>

    <!-- Step 2: Birthday Reveal after Blast -->
    <div id="bday-message-wrap">
      <div class="bday-title">HAPPY BIRTHDAY<br>MY LIFE PARTNER ♥</div>
      <div class="bday-sub">Zindagani badi khoobsurat huyi... Jo tu mera Humdard hai ✨</div>
      <button class="small-replay-btn" onclick="replayExperience()">↻ Replay Experience</button>

  </div>

  <!-- Tiny Unobtrusive Fullscreen Icon Button (Top Right) -->
  <button id="fs-btn" onclick="toggleFullScreen()" title="Fullscreen">⛶</button>

  <canvas id="particles-canvas"></canvas>

  <!-- Audio Player -->
  <audio id="audio-player" preload="auto" playsinline crossorigin="anonymous">
    <source src="./res/song.mp3" type="audio/mpeg">
    <source src="https://raw.githubusercontent.com/uzairsalman02/HBD/main/res/song.mp3" type="audio/mpeg">
  </audio>

  <!-- Virtual 1920x1080 Stage with Unique Splash Shapes -->
  <div id="viewport">
    <div id="stage-scaler">
      <div id="world">

        <!-- Intro Image: 0.jpg -->
        <div class="scene-item" style="left: 460px; top: 690px;">
          <div class="watercolor-art splash-shape-0 step-sketch step-wash step-paint" style="width: 470px; height: 350px;" data-file="0.jpg"></div>
        </div>

        <!-- SCENE 1: 1.jpg -->
        <div class="scene-item" style="left: 1080px; top: 360px;">
          <div class="watercolor-art splash-shape-1" id="art-1" data-file="1.jpg"></div>
        </div>
        <div class="lyric-block" id="lyric-1" style="left: 840px; top: 610px;"></div>

        <!-- SCENE 2: 2.jpg -->
        <div class="lyric-block" id="lyric-2a" style="left: 1840px; top: 250px;"></div>
        <div class="lyric-block" id="lyric-2b" style="left: 2240px; top: 250px;"></div>
        <div class="scene-item" style="left: 2120px; top: 720px;">
          <div class="watercolor-art splash-shape-2" id="art-2" data-file="2.jpg"></div>
        </div>

        <!-- SCENE 3: 3.JPG -->
        <div class="scene-item" style="left: 3300px; top: 380px;">
          <div class="watercolor-art splash-shape-3" id="art-3" data-file="3.JPG"></div>
        </div>

        <!-- SCENE 4: 4.JPG -->
        <div class="lyric-block" id="lyric-4a" style="left: 4220px; top: 260px;"></div>

          <div class="watercolor-art splash-shape-4" id="art-4" data-file="4.JPG"></div>
        </div>

        <!-- SCENE 5: 5.jpg -->

          <div class="watercolor-art splash-shape-5" id="art-5" data-file="5.jpg"></div>
        </div>
        <div class="lyric-block" id="lyric-5" style="left: 5400px; top: 650px;"></div>

      </div>

  </div>

  <script>
    // --- 0. FAST PRIORITY PRELOADER (Unlocks Play button as soon as first 2 images are ready!) ---
    const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/uzairsalman02/HBD/main/res/";
    const boxes = Array.from(document.querySelectorAll('.watercolor-art'));
    const priorityCount = 2; // Unlock Play button once 0.jpg & 1.jpg load; stream 2..5 in background!
    let priorityLoaded = 0;
    let playUnlocked = false;

    function unlockPlayButton() {
      if (playUnlocked) return;
      playUnlocked = true;
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('loader-text').textContent = '100% READY ♥';
      setTimeout(() => {
        document.getElementById('loader-wrap').style.display = 'none';
        document.getElementById('play-btn').style.display = 'inline-block';
      }, 300);
    }

    function loadBoxImage(box, index) {
      const fileName = box.getAttribute('data-file');
      const swappedCase = fileName.endsWith('.JPG')
        ? fileName.replace('.JPG', '.jpg')
        : fileName.replace('.jpg', '.JPG');

      const fallbacks = [
        `./res/${fileName}`,
        `./res/${swappedCase}`,
        `${GITHUB_RAW_BASE}${fileName}`,
        `${GITHUB_RAW_BASE}${swappedCase}`
      ];

      let idx = 0;
      const masterImg = new Image();
      masterImg.decoding = 'async';
      if (index < priorityCount) masterImg.fetchPriority = 'high';

      masterImg.onload = function() {
        const resolvedUrl = masterImg.src;
        box.innerHTML = `
          <img class="layer layer-sketch" src="${resolvedUrl}" alt="">
          <img class="layer layer-wash" src="${resolvedUrl}" alt="">
          <img class="layer layer-paint" src="${resolvedUrl}" alt="">
        `;
        if (index < priorityCount) {
          priorityLoaded++;
          const pct = Math.min(100, Math.round((priorityLoaded / priorityCount) * 100));
          document.getElementById('progress-fill').style.width = pct + '%';
          document.getElementById('loader-text').textContent = `PREPARING SURPRISE... ${pct}%`;
          if (priorityLoaded >= priorityCount) unlockPlayButton();
        }
      };

      masterImg.onerror = function() {
        idx++;
        if (idx < fallbacks.length) {
          masterImg.src = fallbacks[idx];
        } else if (index < priorityCount) {
          priorityLoaded++;
          if (priorityLoaded >= priorityCount) unlockPlayButton();
        }
      };

      masterImg.src = fallbacks[0];
    }

    // Load first 2 images immediately, then load remaining 4 right after
    boxes.slice(0, priorityCount).forEach((box, i) => loadBoxImage(box, i));
    setTimeout(() => {
      boxes.slice(priorityCount).forEach((box, i) => loadBoxImage(box, i + priorityCount));
    }, 100);

    // Fallback: Show play button after 4.5s max even on slow internet
    setTimeout(unlockPlayButton, 4500);

    // --- 1. DESKTOP SCALER FOR MOBILE ---
    const stageScaler = document.getElementById('stage-scaler');
    function updateStageScale() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stageScaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', () => setTimeout(updateStageScale, 200));
    updateStageScale();

    // --- 2. FULLSCREEN & LANDSCAPE LOCK ---
    function requestFullScreenAndLock() {
      const docEl = document.documentElement;
      try {
        if (docEl.requestFullscreen && !document.fullscreenElement) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen && !document.webkitFullscreenElement) {
          docEl.webkitRequestFullscreen();
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      } catch (e) {}
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) requestFullScreenAndLock();
      else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // --- 3. SLOWED PLAYBACK ENGINE (Fixed at 0.85x Slow & Dreamy) ---
    const audio = document.getElementById('audio-player');
    const playbackSpeed = 0.85;

    function applyAudioSpeed() {
      audio.playbackRate = playbackSpeed;
      if ('preservesPitch' in audio) audio.preservesPitch = false;
      else if ('mozPreservesPitch' in audio) audio.mozPreservesPitch = false;
      else if ('webkitPreservesPitch' in audio) audio.webkitPreservesPitch = false;
    }

    // --- 4. CAMERA & 3-STAGE WATERCOLOR REVEAL ENGINE ---
    const world = document.getElementById('world');
    let currentCamX = 860;
    let targetCamX = 860;
    const baseDriftSpeed = 22;
    let activeTimers = [];

    function scheduleTimeout(fn, delay) {
      const id = setTimeout(fn, delay / playbackSpeed);
      activeTimers.push(id);
      return id;
    }

    function clearAllTimers() {
      activeTimers.forEach(id => clearTimeout(id));
      activeTimers = [];
    }

    function panCameraTo(x) {
      targetCamX = x;
    }

    function revealWatercolor(id) {
      const box = document.getElementById(id);
      if (!box) return;
      box.classList.add('step-sketch');
      scheduleTimeout(() => box.classList.add('step-wash'), 480);
      scheduleTimeout(() => box.classList.add('step-paint'), 1000);
    }

    // --- 5. TYPEWRITER LYRICS ---
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function typeText(elId, text, speed = 85, append = false) {
      const el = document.getElementById(elId);
      if (!el) return;
      if (!append) el.textContent = '';
      let i = 0;
      function step() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          el.appendChild(cursor);
          i++;
          scheduleTimeout(step, speed);
        }
      }
      step();
    }

    // --- 6. HUMDARD SONG TIMELINE CUES ---
    const cues = [
      // Scene 1: 00:00 - 00:10
      { songTime: 0.2, run: () => revealWatercolor('art-1') },
      { songTime: 0.5, run: () => typeText('lyric-1', "TERI MUSKURAAHATEIN HAIN\n", 75) },
      { songTime: 3.0, run: () => typeText('lyric-1', "TAAKAT MERI\n", 80, true) },
      { songTime: 5.5, run: () => typeText('lyric-1', "MUJHKO INHEE SE\n", 75, true) },
      { songTime: 8.0, run: () => typeText('lyric-1', "UMMID MILEE", 85, true) },

      // Scene 2: 00:10.5 - 00:20.5
      { songTime: 10.5, run: () => panCameraTo(1920) },
      { songTime: 10.8, run: () => typeText('lyric-2a', "CHAHE KARE KOI\n", 75) },
      { songTime: 12.2, run: () => revealWatercolor('art-2') },
      { songTime: 13.0, run: () => typeText('lyric-2a', "SITAM YEH JAHAN..", 80, true) },
      { songTime: 16.0, run: () => typeText('lyric-2b', "INMEIN HI HAI SADA\n", 75) },
      { songTime: 18.2, run: () => typeText('lyric-2b', "HIFAZAT MERI", 85, true) },

      // Scene 3: 00:20.8 - 00:31.5
      { songTime: 20.8, run: () => panCameraTo(3080) },
      { songTime: 21.2, run: () => typeText('lyric-3', "ZINDGHANI BADI\n", 75) },
      { songTime: 22.8, run: () => revealWatercolor('art-3') },
      { songTime: 23.6, run: () => typeText('lyric-3', "KHOOBSURAT HUYI\n", 80, true) },
      { songTime: 26.5, run: () => typeText('lyric-3', "JANNAT AB AUR\n", 75, true) },
      { songTime: 28.8, run: () => typeText('lyric-3', "KYA HOGI KAHIN", 85, true) },

      // Scene 4: 00:31.8 - 00:41.5
      { songTime: 31.8, run: () => panCameraTo(4220) },
      { songTime: 32.2, run: () => revealWatercolor('art-4') },
      { songTime: 32.5, run: () => typeText('lyric-4a', "JO TU MERA\nHUMDARD HAI\n\n", 85) },
      { songTime: 37.0, run: () => typeText('lyric-4a', "JO TU MERA\nHUMDARD HAI", 85, true) },

      // Scene 5: 00:42.0 - End
      { songTime: 41.8, run: () => { panCameraTo(5360); revealWatercolor('art-5'); } },
      { songTime: 42.5, run: () => typeText('lyric-5', "SUHANA HAR\nDARD HAI...\n\n", 85) },
      { songTime: 47.0, run: () => typeText('lyric-5', "JO TU MERA\nHUMDARD HAI ♥", 90, true) },

      // End Screen Trigger
      { songTime: 53.0, run: () => showEndScreen() }
    ];

    let virtualSongTime = 0;
    let lastFrameTime = null;
    let isRunning = false;

    audio.addEventListener('ended', showEndScreen);

    function startExperience() {
      audio.volume = 1.0;
      audio.currentTime = 0;
      applyAudioSpeed();
      audio.play().catch(err => console.warn("Audio play warning:", err));

      requestFullScreenAndLock();

      document.getElementById('start-overlay').classList.add('hidden');
      document.getElementById('fs-btn').classList.add('visible');

      virtualSongTime = 0;
      lastFrameTime = performance.now();
      isRunning = true;
    }

    function showEndScreen() {
      if (!isRunning) return;
      isRunning = false;
      // Show Gift Box first, hide birthday text until clicked
      document.getElementById('gift-stage').style.display = 'flex';
      document.getElementById('bday-message-wrap').classList.remove('show');
      document.getElementById('end-overlay').classList.remove('hidden');
    }

    // --- GIFT BOX BLAST & HEART SHOWER TRIGGER ---
    let burstParticles = [];
    let heartRainMode = false;

    function openGiftBox() {
      // Hide gift box and reveal "HAPPY BIRTHDAY MY LIFE PARTNER"
      document.getElementById('gift-stage').style.display = 'none';
      document.getElementById('bday-message-wrap').classList.add('show');

      // Trigger explosive heart & confetti blast from center of screen
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const blastColors = ['#e0533c', '#d96b43', '#ff4d6d', '#ffb703', '#f2a65a', '#c9184a'];

      for (let i = 0; i < 95; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 14;
        burstParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          gravity: 0.18 + Math.random() * 0.1,
          size: 8 + Math.random() * 12,
          type: Math.random() > 0.3 ? 'heart' : 'sparkle',
          color: blastColors[Math.floor(Math.random() * blastColors.length)],
          alpha: 1,
          decay: 0.006 + Math.random() * 0.008,
          rotation: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.15
        });
      }

      // Turn on continuous romantic falling hearts shower from top!
      heartRainMode = true;
      particles.forEach(p => {
        p.type = 'heart';
        p.size = 10 + Math.random() * 10;
        p.speedY = 1.2 + Math.random() * 1.8;
        p.color = ['#e0533c', '#ff4d6d', '#d96b43', '#c9184a'][Math.floor(Math.random() * 4)];
        p.alpha = 0.75 + Math.random() * 0.25;
      });
    }

    function replayExperience() {
      clearAllTimers();
      heartRainMode = false;
      burstParticles = [];

      // Restore ambient particles
      particles.forEach(p => {
        p.type = types[Math.floor(Math.random() * types.length)];
        p.size = 6 + Math.random() * 6;
        p.speedY = 0.25 + Math.random() * 0.45;
      });

      document.getElementById('end-overlay').classList.add('hidden');

      currentCamX = 860;
      targetCamX = 860;
      world.style.transform = `translate3d(${1920 / 2 - currentCamX}px, 0, 0)`;

      document.querySelectorAll('.lyric-block').forEach(el => el.textContent = '');

      ['art-1', 'art-2', 'art-3', 'art-4', 'art-5'].forEach(id => {
        const box = document.getElementById(id);
        if (box) box.classList.remove('step-sketch', 'step-wash', 'step-paint');
      });

      cues.forEach(c => c.done = false);

      virtualSongTime = 0;
      audio.currentTime = 0;
      applyAudioSpeed();
      audio.play().catch(() => {});

      requestFullScreenAndLock();
      lastFrameTime = performance.now();
      isRunning = true;
    }

    // Master 60/120FPS Loop
    function masterLoop(now) {
      if (isRunning) {
        const realDt = Math.min((now - lastFrameTime) / 1000, 0.1);
        lastFrameTime = now;

        if (!audio.paused && audio.duration > 0) {
          virtualSongTime = audio.currentTime;
        } else {
          virtualSongTime += realDt * playbackSpeed;
        }

        cues.forEach(c => {
          if (!c.done && virtualSongTime >= c.songTime) {
            c.done = true;
            c.run();
          }
        });

        targetCamX += (baseDriftSpeed * playbackSpeed) * realDt;
        const smoothingFactor = 1 - Math.pow(0.18, realDt);
        currentCamX += (targetCamX - currentCamX) * smoothingFactor;

        world.style.transform = `translate3d(${1920 / 2 - currentCamX}px, 0, 0)`;
      }
      requestAnimationFrame(masterLoop);
    }
    requestAnimationFrame(masterLoop);

    // --- 7. FLOATING HEARTS, SPARKLES & BLAST PARTICLE ENGINE ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const colors = ['#d96b43', '#e88d67', '#e0533c', '#f2a65a', '#c94a38'];
    const types = ['heart', 'sparkle', 'leaf', 'dot'];

    const particles = Array.from({ length: 38 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      type: types[Math.floor(Math.random() * types.length)],
      size: 6 + Math.random() * 6,
      speedY: 0.25 + Math.random() * 0.45,
      speedX: -0.2 + Math.random() * 0.4,
      swayAmp: 0.3 + Math.random() * 0.5,
      swaySpeed: 0.01 + Math.random() * 0.016,
      angle: Math.random() * Math.PI * 2,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 0.45 + Math.random() * 0.45
    }));

    function drawHeart(ctx, size) {
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.4, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.closePath();
      ctx.fill();
    }

    function drawSparkle(ctx, size) {
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(Math.cos((i * Math.PI) / 2) * size, Math.sin((i * Math.PI) / 2) * size);
        ctx.lineTo(Math.cos(((i + 0.5) * Math.PI) / 2) * (size * 0.3), Math.sin(((i + 0.5) * Math.PI) / 2) * (size * 0.3));
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawLeaf(ctx, size) {
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.quadraticCurveTo(size * 0.8, 0, 0, size);
      ctx.quadraticCurveTo(-size * 0.8, 0, 0, -size);
      ctx.closePath();
      ctx.fill();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Render Ambient & Heart-Shower Particles
      particles.forEach(p => {
        p.y += p.speedY;
        p.angle += p.swaySpeed;
        p.x += p.speedX + Math.sin(p.angle) * p.swayAmp;

        if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.x < -20) p.x = canvas.width + 20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(heartRainMode ? Math.sin(p.angle) * 0.25 : p.angle * 0.5);
        ctx.globalAlpha = p.alpha * (0.75 + 0.25 * Math.sin(p.angle * 2));
        ctx.fillStyle = p.color;

        if (p.type === 'heart') drawHeart(ctx, p.size);
        else if (p.type === 'sparkle') drawSparkle(ctx, p.size * 0.9);
        else if (p.type === 'leaf') drawLeaf(ctx, p.size * 0.8);
        else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // 2. Render Gift Box Blast Explosion Particles
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += b.gravity;
        b.vx *= 0.985;
        b.rotation += b.spin;
        b.alpha -= b.decay;

        if (b.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rotation);
        ctx.globalAlpha = Math.max(0, b.alpha);
        ctx.fillStyle = b.color;
        if (b.type === 'heart') drawHeart(ctx, b.size);
        else drawSparkle(ctx, b.size);
        ctx.restore();
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();
  </script>
</body>
</html>
